<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Battle: GitHub Serverless Edition 🌍</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #2c3e50; --secondary: #3498db; --success: #2ecc71;
            --danger: #e74c3c; --warning: #f1c40f; --bg: #f4f6f9; --card-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .game-window { width: 100%; max-width: 950px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1, h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .form-group { max-width: 400px; margin: 0 auto 20px; text-align: center; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #cbd5e0; border-radius: 8px; margin-bottom: 15px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: var(--secondary); }
        .btn { background: var(--secondary); color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: inline-block; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-center { display: block; margin: 20px auto 0; }
        .winner-banner { background: #fef9e7; border: 2px dashed var(--warning); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 18px; font-weight: bold; color: #7d6608; display: none; }
        .dashboard-grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .leaderboard-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        .leaderboard-table th, .leaderboard-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        .leaderboard-table th { background: var(--primary); color: white; }
        .row-winner { background-color: #e8f8f5 !important; font-weight: bold; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #edf2f7; padding: 10px 15px; border-radius: 8px; margin-bottom: 25px; font-weight: bold; }
        .progress-bar { background: #cbd5e0; height: 10px; width: 40%; border-radius: 5px; overflow: hidden; }
        .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.2s; }
        .question-box { background: #f7fafc; border-left: 5px solid var(--secondary); padding: 20px; font-size: 20px; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: white; border: 2px solid #e2e8f0; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background: #f0f4f8; }
        .option-btn:disabled { opacity: 0.6; }
        .feedback { padding: 15px; border-radius: 8px; margin-top: 15px; display: none; font-weight: 500; }
        .feedback.correct { background: #c6f6d5; color: #22543d; }
        .feedback.incorrect { background: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>

<div class="game-window">
    
    <div id="screen-welcome" class="screen active">
        <h1>Grammar Battle: Cloud Edition ☁️</h1>
        <p class="subtitle">Some vs. Any — Alojado completamente en GitHub</p>
        <div class="form-group">
            <input type="text" id="player-name" placeholder="Tu nombre o alias" maxlength="15">
            <button class="btn btn-success" style="width: 100%;" onclick="startPlayer()">Unirse a la Batalla</button>
        </div>
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">
        <div style="text-align: center;">
            <button class="btn" style="background: #7f8c8d;" onclick="requestDashboardAccess()">Ver Pizarra en Vivo (PIN: 1990)</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="status-bar">
            <span>Jugador: <span id="display-student-name" style="color:var(--secondary)"></span></span>
            <div class="progress-bar"><div class="progress-fill" id="bar-fill"></div></div>
            <span>Progreso: <span id="q-counter">1</span>/31</span>
        </div>
        <div class="question-box" id="question-text">Cargando...</div>
        <div class="options-grid" id="options-box"></div>
        <div class="feedback" id="feedback-box"></div>
        <button class="btn btn-center" id="next-btn" style="display:none;" onclick="nextQuestion()">Siguiente Pregunta &rarr;</button>
    </div>

    <div id="screen-end" class="screen" style="text-align: center;">
        <h2>¡Ronda Terminada! 🏁</h2>
        <p style="font-size: 20px; margin: 20px 0;">Puntaje enviado a la nube: <strong id="final-score" style="color: var(--success)">0</strong> de 31</p>
        <button class="btn" onclick="location.reload()">Volver a Jugar</button>
    </div>

    <div id="screen-dashboard" class="screen">
        <h2>📋 Pizarra en Vivo (GitHub Cloud)</h2>
        <div class="winner-banner" id="winner-banner"></div>
        <div class="dashboard-grid">
            <div>
                <table class="leaderboard-table">
                    <thead>
                        <tr><th>Pos.</th><th>Estudiante</th><th>Progreso</th><th>Aciertos</th></tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <div style="background: #edf2f7; padding: 20px; border-radius: 8px; height: fit-content;">
                <h3>Controles globales</h3>
                <button class="btn btn-danger" style="width: 100%; margin-top: 15px;" onclick="clearDatabaseServer()">Reiniciar Sala Mundial</button>
                <button class="btn btn-center" style="background: var(--primary); width: 100%; margin-top:10px;" onclick="showScreen('screen-welcome')">Salir</button>
            </div>
        </div>
    </div>

</div>

<script>
// --- CONFIGURACIÓN DE FIREBASE (BASE DE DATOS EN LA NUBE) ---
// NOTA: Esta es una base de datos pública de prueba. Puedes cambiar estos datos por los tuyos propios de Firebase.
const firebaseConfig = {
    databaseURL: "https://grammar-battle-demo-default-rtdb.firebaseio.com/" 
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const PIN_CORRECTO = "1990";
let currentIdx = 0, score = 0, currentPlayer = "";

const questions = [
    { q: "I have ______ money in my wallet. Let's buy a coffee.", o: ["some", "any"], a: 0, e: "Afirmativa con incontable." },
    { q: "She doesn't have ______ friends in this city yet.", o: ["some", "any"], a: 1, e: "Oración negativa ('doesn't')." },
    { q: "Are there ______ clean glasses left in the kitchen?", o: ["some", "any"], a: 1, e: "Pregunta directa general." },
    { q: "We need to buy ______ apples for the pie.", o: ["some", "any"], a: 0, e: "Afirmativa con plural contable." },
    { q: "I looked around, but I didn't see ______ cars outside.", o: ["some", "any"], a: 1, e: "Oración negativa ('didn't')." },
    { q: "Would you like ______ milk in your tea?", o: ["some", "any"], a: 0, e: "Excepción: Es un Ofrecimiento." },
    { q: "Can I have ______ water, please?", o: ["some", "any"], a: 0, e: "Excepción: Es una Petición amable." },
    { q: "They don't want ______ trouble with the neighbors.", o: ["some", "any"], a: 1, e: "Negativa ('don't')." },
    { q: "I heard ______ beautiful songs on the radio today.", o: ["some", "any"], a: 0, e: "Afirmativa en pasado." },
    { q: "Do you know ______ good restaurants near here?", o: ["some", "any"], a: 1, e: "Pregunta abierta ordinaria." },
    { q: "Look! There is ______ climbing up the tree.", o: ["someone", "anyone"], a: 0, e: "Afirmativa (alguien real)." },
    { q: "The room was completely empty. I didn't meet ______.", o: ["someone", "anyone"], a: 1, e: "Negativa ('didn't'). Significa 'a nadie'." },
    { q: "Is ______ listening to me? Please pay attention.", o: ["someone", "anyone"], a: 1, e: "Pregunta directa." },
    { q: "I think ______ forgot their keys on my desk.", o: ["someone", "anyone"], a: 0, e: "Afirmativa (Suposición)." },
    { q: "Don't tell ______ about our secret plan!", o: ["someone", "anyone"], a: 1, e: "Imperativo negativo ('Don't tell')." },
    { q: "Can ______ help me move this heavy box, please?", o: ["someone", "anyone"], a: 0, e: "Excepción: Petición de ayuda directa." },
    { q: "Did ______ call me while I was in the bathroom?", o: ["someone", "anyone"], a: 1, e: "Pregunta de evento pasado." },
    { q: "I am so hungry. I need to eat ______ right now.", o: ["something", "anything"], a: 0, e: "Afirmativa (necesidad real)." },
    { q: "She opened the box, but there wasn't ______ inside.", o: ["something", "anything"], a: 1, e: "Negativa ('wasn't'). Significa 'nada'." },
    { q: "Did you buy ______ interesting at the shopping mall?", o: ["something", "anything"], a: 1, e: "Pregunta general de acciones." },
    { q: "Would you like ______ to drink while you wait?", o: ["something", "anything"], a: 0, e: "Excepción: Ofrecimiento de cortesía." },
    { q: "I don't know ______ about computer programming.", o: ["something", "anything"], a: 1, e: "Negativa ('don't know'). Significa 'nada'." },
    { q: "He said ______ to his boss, but I couldn't hear what.", o: ["something", "anything"], a: 0, e: "Afirmativa simple." },
    { q: "Is there ______ else you need before I leave?", o: ["something", "anything"], a: 1, e: "Pregunta de servicio." },
    { q: "We want to travel ______ warm and sunny this winter.", o: ["somewhere", "anywhere"], a: 0, e: "Afirmativa (deseo de destino)." },
    { q: "I lost my passport! I can't find it ______.", o: ["somewhere", "anywhere"], a: 1, e: "Negativa ('can't'). Significa 'en ningún lado'." },
    { q: "Are you going ______ special for your anniversary?", o: ["somewhere", "anywhere"], a: 1, e: "Pregunta abierta de traslado." },
    { q: "Let's sit ______ near the window.", o: ["somewhere", "anywhere"], a: 0, e: "Sugerencia afirmativa ('Let's')." },
    { q: "He hasn't gone ______ since he got sick.", o: ["somewhere", "anywhere"], a: 1, e: "Negativa perfecta ('hasn't gone')." },
    { q: "Can we go ______ quiet to talk, please?", o: ["somewhere", "anywhere"], a: 0, e: "Excepción: Propuesta en beneficio común." },
    { q: "Did you see my cat? It must be hiding ______ in the house.", o: ["somewhere", "anywhere"], a: 0, e: "Deducción afirmativa ('must be')." }
];

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function startPlayer() {
    const name = document.getElementById('player-name').value.trim();
    if(!name) return alert("Ingresa un nombre.");
    // Sanitizar nombre para evitar errores en las rutas de Firebase
    currentPlayer = name.replace(/[.#$/\[\]]/g, "");
    document.getElementById('display-student-name').innerText = currentPlayer;
    
    // Crear registro inicial en la nube
    database.ref('players/' + currentPlayer).set({
        name: currentPlayer, answered: 0, score: 0, timestamp: firebase.database.ServerValue.TIMESTAMP
    });
    
    showScreen('screen-quiz');
    renderQuestion();
}

function renderQuestion() {
    const item = questions[currentIdx];
    document.getElementById('q-counter').innerText = currentIdx + 1;
    document.getElementById('bar-fill').style.width = `${(currentIdx / questions.length) * 100}%`;
    document.getElementById('question-text').innerHTML = `<strong>${currentIdx + 1}.</strong> ${item.q.replace('______', '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}`;
    const box = document.getElementById('options-box'); box.innerHTML = '';
    item.o.forEach((opt, idx) => {
        const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
        btn.onclick = () => checkResponse(idx); box.appendChild(btn);
    });
    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function checkResponse(idx) {
    const item = questions[currentIdx];
    const fb = document.getElementById('feedback-box');
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    fb.style.display = 'block';
    if(idx === item.a) { fb.className = "feedback correct"; fb.innerHTML = `¡Correcto!`; score++; }
    else { fb.className = "feedback incorrect"; fb.innerHTML = `Incorrecto. Era "${item.o[item.a]}"`; }
    
    // Guardar en Firebase de manera asíncrona e instantánea
    database.ref('players/' + currentPlayer).update({
        answered: currentIdx + 1,
        score: score,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });
    
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    if(currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
    else { document.getElementById('final-score').innerText = score; showScreen('screen-end'); }
}

function requestDashboardAccess() {
    if(prompt("PIN del Docente:") === PIN_CORRECTO) showScreen('screen-dashboard');
    else alert("Incorrecto.");
}

// --- ESCUCHAR ACTUALIZACIONES EN VIVO DESDE LA NUBE ---
database.ref('players').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const tbody = document.getElementById('leaderboard-body'); tbody.innerHTML = '';
    const banner = document.getElementById('winner-banner');
    
    // Convertir objeto en lista y ordenar por puntos, desempatando por velocidad (timestamp antiguo gana)
    const sortedPlayers = Object.keys(data).map(key => data[key])
        .sort((a, b) => b.score - a.score || a.timestamp - b.timestamp);

    if(sortedPlayers.length === 0) { banner.style.display = 'none'; tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Esperando jugadores...</td></tr>'; return; }
    
    banner.style.display = 'block';
    banner.innerHTML = `👑 Líder Actual: <strong>${sortedPlayers[0].name}</strong> con <strong>${sortedPlayers[0].score} pts</strong>`;

    sortedPlayers.forEach((p, i) => {
        const row = document.createElement('tr');
        if(i === 0) row.className = 'row-winner';
        row.innerHTML = `<td><strong>#${i+1}</strong></td><td>${i===0?'👑 ':''}${p.name}</td><td>${p.answered}/31</td><td style="color:var(--success);font-weight:bold;">${p.score} pts</td>`;
        tbody.appendChild(row);
    });
});

// Escuchar si el profesor limpia la sala
database.ref('reset_flag').on('value', (snapshot) => {
    if(snapshot.val() === true && currentPlayer !== "") {
        alert("El profesor ha reiniciado la sala de juego.");
        location.reload();
    }
});

function clearDatabaseServer() {
    if(prompt("PIN definitivo para borrar todo:") === PIN_CORRECTO) {
        database.ref('players').remove();
        database.ref('reset_flag').set(true);
        setTimeout(() => database.ref('reset_flag').set(false), 2000);
    }
}
</script>
</body>
</html>
